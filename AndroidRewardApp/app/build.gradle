plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.app.rewardapp'
    compileSdk 36

    defaultConfig {
        applicationId "com.app.rewardapp"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildFeatures {
        viewBinding true
        buildConfig = true
    }

    buildTypes {
        release {
            ndk.debugSymbolLevel =  "FULL"
            shrinkResources false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        disable 'OldTargetApi'
        disable 'GradleDependency'
        checkReleaseBuilds false
    }
    aaptOptions {
        cruncherEnabled = false
    }

    buildTypes.each {
        it.buildConfigField 'String', 'API_URL', API_URL
        it.buildConfigField 'String', 'API_KEY', API_KEY
    }
    ndkVersion "29.0.14206865"

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'com.google.android.gms:play-services-auth:21.0.0'

    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation project(':luckyWheel')
    implementation 'com.alimuzaffar.lib:pinentryedittext:2.0.6'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.5.1'

    implementation 'com.karumi:dexter:6.2.3'
    implementation platform('com.google.firebase:firebase-bom:33.1.1')
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.airbnb.android:lottie:6.4.0'
    implementation "androidx.browser:browser:1.4.0"
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // ads sdk
    implementation 'com.applovin:applovin-sdk:13.3.0' // updated to latest version
    implementation 'com.applovin.mediation:facebook-adapter:+'

    implementation 'com.facebook.android:audience-network-sdk:6.20.0' // updated to latest version
    implementation 'com.unity3d.ads:unity-ads:4.15.0' // updated to latest version
    implementation 'com.google.android.gms:play-services-ads:24.3.0' // updated to latest version

    implementation 'com.unity3d.ads-mediation:mediation-sdk:8.6.0'
    implementation 'com.unity3d.ads-mediation:adquality-sdk:7.23.3'
    implementation 'com.unity3d.ads-mediation:facebook-adapter:4.3.48'
    implementation 'com.vungle:vungle-ads:7.5.0'
    implementation 'com.inmobi.monetization:inmobi-ads-kotlin:10.8.2'

    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    implementation 'com.google.android.gms:play-services-basement:18.5.0'
    implementation 'com.google.android.gms:play-services-base:18.5.0'

    implementation 'com.github.AnupKumarPanwar:ScratchView:1.9.1'
    implementation 'io.github.florent37:shapeofview:1.4.7'
    implementation 'com.github.MakeOpinionGmbH:cpx-research-SDK-Android:1.5.9'
    implementation 'com.onesignal:OneSignal:4.8.6'

    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:13.0.0'
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:custom-ui:13.0.0'
    implementation 'com.github.shurajcodx:android-app-rating-dialog:1.0.6'
    implementation 'com.facebook.infer.annotation:infer-annotation:0.18.0'


}